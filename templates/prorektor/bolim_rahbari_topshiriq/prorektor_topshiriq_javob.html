{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topshiriqqa javob yozish</title>
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'fontawesomefree/css/all.min.css' %}" rel="stylesheet">
    <link href="{% static 'asosiy/prorektor/main.css' %}" rel="stylesheet">
</head>
<body>
    {% include "prorektor/navbar.html" %}
    {% include "prorektor/sidebar.html" %}

    <main class="main-content" id="mainContent">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-8 col-xl-10">
                    <div class="card border-0 shadow-lg overflow-hidden">
                        <div class="card-header bg-primary text-white py-3">
                            <h4 class="mb-0">
                                <i class="fas fa-reply me-2"></i>
                                Topshiriqqa javob yozish
                            </h4>
                        </div>
                        <div class="card-body p-4 p-md-5">
                            <div class="mb-4">
                                <strong>Topshiriq:</strong>
                                <div class="border rounded p-3 mt-2 bg-light">
                                    <div class="mb-2"><b>Sarlavha:</b> {{ prorektor_topshiriq.title }}</div>
                                    <div><b>Matn:</b> {{ prorektor_topshiriq.body }}</div>
                                </div>
                            </div>
                            <form method="post" class="needs-validation" novalidate>
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="id_title" class="form-label">Javob sarlavhasi</label>
                                    <input type="text" name="title" id="id_title" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="id_body" class="form-label">Javob matni</label>
                                    <textarea name="body" id="id_body" class="form-control" rows="4" required></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="id_izoh" class="form-label">Izoh (ixtiyoriy)</label>
                                    <textarea name="izoh" id="id_izoh" class="form-control" rows="2"></textarea>
                                </div>
                                <div class="d-flex justify-content-between mt-4 pt-3 border-top">
                                    <a href="{% url 'prorektor_topishiriq_detail' prorektor_topshiriq.pk %}" class="btn btn-outline-secondary">
                                        <i class="fas fa-arrow-left me-2"></i> Ortga
                                    </a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="fas fa-paper-plane me-2"></i> Yuborish
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'asosiy/prorektor/main.js' %}"></script>
</body>
