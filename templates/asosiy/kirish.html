{% load static %}
<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QO'QON DAVLAT UNIVERSITETI - Tizimga kirish</title>
    
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/itpark_logo.png' %}">
    
    <!-- CSS Libraries -->
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'fontawesomefree/css/all.min.css' %}" rel="stylesheet">
    <link href="{% static 'asosiy/home/kirish.css' %}" rel="stylesheet">
    
    <style>
        /* Boshqa sahifalar bilan bir xil ranglar */
        .university-logo-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        }
        
        .login-form-section {
            background: rgba(255, 255, 255, 0.95) !important;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            border: none !important;
            color: white !important;
            transition: all 0.3s ease !important;
        }
        
        .btn-login:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%) !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2) !important;
        }
        
        .login-main-wrapper {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.7));
            backdrop-filter: blur(20px);
        }
        
        .form-control:focus {
            border-color: #86b7fe !important;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25) !important;
        }
        
        /* Label fonini shaffof qilish */
        .form-floating > label {
            background-color: transparent !important;
            color: #6c757d !important;
        }
        
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label,
        .form-floating > .form-control:valid ~ label {
            background-color: transparent !important;
            color: #0d6efd !important;
            transform: scale(.85) translateY(-0.5rem) translateX(0.15rem) !important;
        }
        
        /* Avtomatik to'ldirilgan maydonlar uchun */
        .form-floating > .form-control:-webkit-autofill ~ label {
            background-color: transparent !important;
            color: #0d6efd !important;
            transform: scale(.85) translateY(-0.5rem) translateX(0.15rem) !important;
        }
        
        /* Avtofill input uchun fon rangini o'zgartirish */
        .form-control:-webkit-autofill,
        .form-control:-webkit-autofill:hover,
        .form-control:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0px 1000px rgba(255, 255, 255, 0.9) inset !important;
            -webkit-text-fill-color: #212529 !important;
            transition: background-color 5000s ease-in-out 0s !important;
        }
        
        body {
            background: 
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(13, 110, 253, 0.05) 0%, transparent 50%) !important;
        }
    </style>
</head>

<body>
    <div class="container-fluid login-container">
        <main class="d-flex justify-content-center align-items-center min-vh-100">
            <div class="row g-0 w-100 login-main-wrapper shadow-lg" style="border-radius: 20px; overflow: hidden;">
                <!-- Logo Section -->
                <div class="col-lg-6 university-logo-section">
                    <img src="{% static 'asosiy/images/logo.png' %}" alt="QDU Logo" class="logo-img">
                    <h2 class="university-name">QO'QON DAVLAT UNIVERSITETI</h2>
                </div>

                <!-- Login Form Section -->
                <div class="col-lg-6 login-form-section">
                    <h1 class="login-title">TIZIMGA KIRISH</h1>
                    
                    {% if messages %}
                    <div class="mb-4">
                        {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-floating mb-4">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Foydalanuvchi nomi" required>
                            <label for="username">Foydalanuvchi nomi</label>
                        </div>
                        <div class="form-floating mb-5 position-relative">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Parol" required>
                            <label for="password">Parol</label>
                            <i class="bi bi-eye-slash password-toggle" id="togglePassword"></i>
                        </div>
                        <button type="submit" class="btn btn-login w-100">
                            <i class="bi bi-box-arrow-in-right me-2"></i> KIRISH
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript Libraries -->
    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="{% static 'asosiy/home/kirish.js' %}"></script>
</body>
</html>
