{% load static %}
<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QO'QON DAVLAT UNIVERSITETI - Tizimga kirish</title>
    
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/itpark_logo.png' %}">
    
    <!-- CSS Libraries -->
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'fontawesomefree/css/all.min.css' %}" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #0b5ed7;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --primary-font: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        body {
            font-family: var(--primary-font);
            font-weight: 400;
            line-height: 1.6;
            color: var(--dark-color);
            background-color: var(--light-color);
        }
        
        .login-container {
            min-height: 100vh;
            padding: 1rem;
        }
        
        .login-main-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            width: 95%;
        }
        
        .university-logo-section {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px 0 0 20px;
        }
        
        .login-form-section {
            background: white;
            padding: 5rem 4rem;
            border-radius: 0 20px 20px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        
        .login-title {
            color: var(--primary-color);
            margin-bottom: 3rem;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: clamp(1.5rem, 3vw, 2.2rem);
        }
        
        .form-control {
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            border: 2px solid #e9ecef;
            font-size: 1.05rem;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        
        .form-floating>label {
            padding: 1rem 1.25rem;
            font-size: 1.05rem;
            color: #6c757d;
        }
        
        .btn-login {
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            background-color: var(--primary-color);
            border: none;
            transition: all 0.3s;
        }
        
        .btn-login:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        .university-name {
            font-size: clamp(1.5rem, 3vw, 2rem);
            margin-top: 2rem;
            font-weight: 700;
            text-align: center;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .logo-img {
            max-height: 150px;
            width: auto;
            margin-bottom: 2rem;
        }
        
        /* Password toggle button */
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
            z-index: 5;
        }
        
        .password-toggle:hover {
            color: var(--primary-color);
        }
        
        /* Responsive adjustments */
        @media (max-width: 991.98px) {
            .university-logo-section {
                padding: 3rem 2rem;
                border-radius: 20px 20px 0 0;
            }
            
            .login-form-section {
                padding: 3rem 2rem;
                border-radius: 0 0 20px 20px;
            }
            
            .logo-img {
                max-height: 120px;
            }
        }
        
        @media (max-width: 767.98px) {
            .university-logo-section {
                padding: 2rem 1.5rem;
            }
            
            .login-form-section {
                padding: 2.5rem 1.5rem;
            }
            
            .logo-img {
                max-height: 100px;
                margin-bottom: 1.5rem;
            }
            
            .university-name {
                font-size: 1.5rem;
            }
        }
        
        @media (min-width: 1400px) {
            .login-main-wrapper {
                max-width: 1200px;
            }
            
            .university-logo-section {
                padding: 5rem 4rem;
            }
            
            .login-form-section {
                padding: 6rem 5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container-fluid login-container">
        <main class="d-flex justify-content-center align-items-center min-vh-100">
            <div class="row g-0 w-100 login-main-wrapper shadow-lg" style="border-radius: 20px; overflow: hidden;">
                <!-- Logo Section -->
                <div class="col-lg-6 university-logo-section">
                    <img src="{% static 'asosiy/images/logo.png' %}" alt="QDU Logo" class="logo-img">
                    <h2 class="university-name">QO'QON DAVLAT UNIVERSITETI</h2>
                </div>

                <!-- Login Form Section -->
                <div class="col-lg-6 login-form-section">
                    <h1 class="login-title">TIZIMGA KIRISH</h1>
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-floating mb-4">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Foydalanuvchi nomi" required>
                            <label for="username">Foydalanuvchi nomi</label>
                        </div>
                        <div class="form-floating mb-5 position-relative">
                            <input type="text" class="form-control" id="password" name="password" placeholder="Parol" required>
                            <label for="password">Parol</label>
                            <i class="bi bi-eye-slash password-toggle" id="togglePassword"></i>
                        </div>
                        <button type="submit" class="btn btn-login w-100">
                            <i class="bi bi-box-arrow-in-right me-2"></i> KIRISH
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript Libraries -->
    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    
    <script>
        // Password visibility toggle
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this;
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            }
        });

        // Input focus style enhancement
        $(document).ready(function() {
            $('.form-control').focus(function() {
                $(this).parent().find('label').css('color', 'var(--primary-color)');
            }).blur(function() {
                $(this).parent().find('label').css('color', '');
            });
        });
    </script>
</body>
</html>
